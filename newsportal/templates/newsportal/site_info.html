{% load static %}
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Bihar Online Updates</title>
    <link rel="stylesheet" href="{% static 'newsportal/style.css' %}">
</head>
<body class="detail-page">
    <main class="container">
        <nav class="detail-breadcrumbs" aria-label="Breadcrumb">
            <a href="{% url 'home' %}">Home</a>
            <span aria-hidden="true">/</span>
            <span aria-current="page">{{ page.title }}</span>
        </nav>
        <article class="detail-main">
            <h1>{{ page.title }}</h1>
            <p>{{ page.intro }}</p>
            <p>{{ page.details }}</p>
            {% if page.title == 'Contact and social pages' %}
            <nav class="detail-share" aria-label="Bihar Online Updates social pages">
                <a href="{{ social_links.youtube }}" target="_blank" rel="noopener noreferrer">YouTube</a>
                <a href="{{ social_links.instagram }}" target="_blank" rel="noopener noreferrer">Instagram</a>
                <a href="{{ social_links.telegram }}" target="_blank" rel="noopener noreferrer">Telegram</a>
                <a href="{{ social_links.whatsapp }}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
            </nav>
            {% endif %}
            <p class="detail-footer"><a class="detail-back-category" href="{% url 'legacy-all-updates' %}">View published updates</a></p>
            <a class="detail-back-category" href="{% url 'home' %}">← Back to home</a>
        </article>
    </main>
</body>
</html>
